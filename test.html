<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kelimeli Online v0.3 Test</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#10141d;color:#f5f7fb}main{max-width:980px;margin:auto;padding:24px}.card{background:#181e2a;border:1px solid #30394b;border-radius:18px;padding:18px;margin:14px 0}h1,h2{margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1 1 220px}input,select,button{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid #3a465c}input,select{background:#0f141e;color:#fff}button{background:#2f6df6;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#242c3a}button.danger{background:#873b49}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.room{border:1px solid #354158;border-radius:14px;padding:14px;background:#111722}.muted{color:#a7b0c0;font-size:14px}.ok{color:#66df9a}.bad{color:#ff8b96}.player{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #2a3343}.patterns{font-size:18px;letter-spacing:2px}.board{display:grid;gap:5px;margin:12px 0}.guess-row{display:flex;gap:5px}.tile{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:#272f3e;font-weight:900}.correct{background:#2f9d61}.present{background:#c59a27}.absent{background:#5a6270}.status{padding:10px 12px;border-radius:12px;background:#0f151f;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;background:#0c1119;padding:14px;border-radius:12px;max-height:220px;overflow:auto}</style></head><body><main>
<h1>Kelimeli Online — v0.3 Seri Maç Testi</h1><p class="muted">Standart odalar 5 kelime × 200 sn. Özel odalarda ayarlar özelleştirilebilir.</p>
<section class="card"><h2>1. Bağlan</h2><div class="row"><input id="name" class="grow" maxlength="20" placeholder="Oyuncu adı"><button id="connectBtn">Bağlan</button></div><p id="state" class="muted">Bağlı değil.</p></section>
<section class="card"><h2>2. Sabit Odalar</h2><div id="rooms" class="rooms"></div></section>
<section class="card"><h2>3. Özel Oda</h2><div class="row"><select id="size"><option value="2">2 kişi</option><option value="3">3 kişi</option><option value="4" selected>4 kişi</option></select><select id="wordCount"><option value="3">3 kelime</option><option value="5" selected>5 kelime</option><option value="7">7 kelime</option><option value="10">10 kelime</option></select><select id="duration"><option value="90">90 sn</option><option value="120">120 sn</option><option value="150">150 sn</option><option value="200" selected>200 sn</option><option value="240">240 sn</option><option value="300">300 sn</option></select><button id="create">Özel oda oluştur</button></div><div class="row" style="margin-top:10px"><input id="code" inputmode="numeric" maxlength="6" placeholder="6 haneli kod"><button id="joinCode">Kodla katıl</button></div></section>
<section class="card"><h2>4. Oda</h2><div id="current" class="muted">Bir odada değilsin.</div><div class="row" style="margin-top:12px"><button id="ready" class="secondary">Hazırım</button><button id="startPrivate">Özel maçı başlat</button><button id="leave" class="danger">Odadan çık</button></div></section>
<section class="card"><h2>5. Karşılaşma</h2><div id="matchStatus" class="status">Karşılaşma bekleniyor.</div><div id="opponents"></div><div id="board" class="board"></div><div class="row"><input id="guess" maxlength="5" class="grow" placeholder="5 harfli tahmin"><button id="submitGuess">Tahmin Et</button><button id="surrender" class="danger">Pes Et</button></div><div id="result" class="status" hidden></div></section>
<section class="card"><h2>Olay Günlüğü</h2><pre id="log">Hazır.</pre></section>
</main><script src="/socket.io/socket.io.js"></script><script>
let socket=null,currentRoom=null,ready=false,myId=null,rows=[];const $=id=>document.getElementById(id),icons={correct:"🟩",present:"🟨",absent:"⬛"};
function log(v){const t=new Date().toLocaleTimeString("tr-TR"),s=typeof v==="string"?v:JSON.stringify(v,null,2);$("log").textContent=`[${t}] ${s}\n\n`+$("log").textContent}function connected(ok,d=""){$("state").innerHTML=ok?`<span class="ok">● Bağlı</span> ${d}`:`<span class="bad">● Bağlı değil</span> ${d}`}
function renderRooms(list){$("rooms").innerHTML=list.map(r=>`<div class="room"><b>${r.name}</b><div class="muted">${r.playerCount}/${r.maxPlayers} • ${r.status}<br>${r.settings.wordCount} kelime × ${r.settings.durationSec} sn</div><button onclick="joinRoom('${r.id}')">Katıl</button></div>`).join("")}
function renderRoom(r){currentRoom=r;if(!r){$("current").textContent="Bir odada değilsin.";return}$("current").innerHTML=`<b>${r.name}</b> — ${r.playerCount}/${r.maxPlayers}${r.code?` • Kod: <b>${r.code}</b>`:""} • ${r.settings.wordCount} kelime × ${r.settings.durationSec} sn<div>${r.players.map(p=>`<div class="player"><span>${p.isHost?"👑 ":""}${p.name}${p.id===myId?" (sen)":""}</span><span>${p.score||0} P • ${p.ready?"Hazır":"Bekliyor"}</span></div>`).join("")}</div>`;renderOpponents(r)}
function renderOpponents(r){if(!r)return;$("opponents").innerHTML=r.players.filter(p=>p.id!==myId).map(p=>`<div class="player"><span>${p.name} • ${p.score||0} P</span><span class="patterns">${(p.match?.progress||[]).map(row=>row.map(x=>icons[x]).join("")).join(" ")||"—"}</span></div>`).join("")}
function renderBoard(){$("board").innerHTML=rows.map(r=>`<div class="guess-row">${[...r.word.toLocaleUpperCase('tr-TR')].map((ch,i)=>`<div class="tile ${r.result[i]}">${ch}</div>`).join("")}</div>`).join("")}
async function makeSession(name){const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});return r.json()}
async function connect(){const name=$("name").value.trim()||`Test ${Math.floor(Math.random()*900+100)}`,s=await makeSession(name);socket=io({auth:{token:s.token},transports:['websocket','polling']});socket.on('connect',()=>{connected(true,`(${name})`);socket.emit('rooms:get',r=>r.ok&&renderRooms(r.rooms))});socket.on('session:ready',d=>{myId=d.playerId;if(d.room)renderRoom(d.room)});socket.on('rooms:update',renderRooms);socket.on('room:state',renderRoom);socket.on('match:countdown',d=>{$("matchStatus").textContent=`Geri sayım: ${d.endsAt}`});socket.on('match:started',d=>startRound(d));socket.on('round:started',d=>startRound(d));socket.on('match:progress',d=>renderRoom(d.room));socket.on('round:finished',d=>{$("result").hidden=false;$("result").innerHTML=`<b>Kelime ${d.round}/${d.totalRounds}: ${d.answer.toLocaleUpperCase('tr-TR')}</b><br>${d.breakdown.map(x=>`${x.place}. ${x.name}: +${x.points} → ${x.totalScore} P (${x.bonuses.map(b=>`${b.label} ${b.points?`+${b.points}`:''}`).join(', ')})`).join('<br>')}`;renderRoom(d.room)});socket.on('match:finished',d=>{$("matchStatus").textContent=`OYUN BİTTİ • ${d.winner?.name||'—'} kazandı`;$("result").hidden=false;$("result").innerHTML=d.standings.map(x=>`${x.place}. ${x.name}: ${x.score} P`).join('<br>');renderRoom(d.room)});socket.on('match:reset',d=>{$("matchStatus").textContent='Yeni karşılaşma için hazır ol.';ready=false;$("ready").textContent='Hazırım';renderRoom(d.room)})}
function startRound(d){rows=[];renderBoard();$("result").hidden=true;$("matchStatus").textContent=`Kelime ${d.round}/${d.totalRounds} başladı • ${Math.round(d.durationMs/1000)} sn`;renderRoom(d.room)}function req(){if(!socket?.connected){alert('Önce bağlan.');return false}return true}
window.joinRoom=id=>{if(!req())return;socket.emit('room:join',{roomId:id},r=>{if(!r.ok)alert(r.error.message);else renderRoom(r.room)})};$("connectBtn").onclick=()=>connect().catch(e=>alert(e.message));$("create").onclick=()=>socket?.emit('room:create-private',{maxPlayers:Number($("size").value),wordCount:Number($("wordCount").value),durationSec:Number($("duration").value)},r=>{if(!r.ok)alert(r.error.message);else{$("code").value=r.code;renderRoom(r.room)}});$("joinCode").onclick=()=>{const c=$("code").value.replace(/\D/g,'').slice(0,6);if(c.length===6)joinRoom(c)};$("ready").onclick=()=>{ready=!ready;socket?.emit('player:ready',{ready},r=>{if(!r.ok){ready=!ready;alert(r.error.message)}$("ready").textContent=ready?'Hazır değilim':'Hazırım'})};$("startPrivate").onclick=()=>socket?.emit('match:start-private',{},r=>{if(!r.ok)alert(r.error.message)});$("leave").onclick=()=>socket?.emit('room:leave',()=>renderRoom(null));$("submitGuess").onclick=()=>{const word=$("guess").value.trim();socket?.emit('match:guess',{word},r=>{if(!r.ok)return alert(r.error.message);rows.push({word:r.guess,result:r.result});renderBoard();$("guess").value=''})};$("guess").onkeydown=e=>{if(e.key==='Enter')$("submitGuess").click()};$("surrender").onclick=()=>socket?.emit('match:surrender',{},r=>{if(r.ok)$("matchStatus").textContent=`Pes ettin • ${r.answer.toLocaleUpperCase('tr-TR')}`});fetch('/api/rooms').then(r=>r.json()).then(d=>d.ok&&renderRooms(d.rooms));
</script></body></html>
