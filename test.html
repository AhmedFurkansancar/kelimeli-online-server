<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kelimeli Online v0.2 Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#10141d;color:#f5f7fb}main{max-width:980px;margin:auto;padding:24px}.card{background:#181e2a;border:1px solid #30394b;border-radius:18px;padding:18px;margin:14px 0}h1,h2{margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1 1 220px}input,select,button{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid #3a465c}input,select{background:#0f141e;color:#fff}button{background:#2f6df6;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#242c3a}button.danger{background:#873b49}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.room{border:1px solid #354158;border-radius:14px;padding:14px;background:#111722}.muted{color:#a7b0c0;font-size:14px}.ok{color:#66df9a}.bad{color:#ff8b96}.player{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #2a3343}.player:last-child{border-bottom:0}.patterns{font-size:18px;letter-spacing:2px;white-space:nowrap}.board{display:grid;gap:5px;margin:12px 0}.guess-row{display:flex;gap:5px}.tile{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:#272f3e;font-weight:900}.correct{background:#2f9d61}.present{background:#c59a27}.absent{background:#5a6270}.status{padding:10px 12px;border-radius:12px;background:#0f151f;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;background:#0c1119;padding:14px;border-radius:12px;max-height:220px;overflow:auto}
</style></head><body><main>
<h1>Kelimeli Online — v0.2 Maç Testi</h1><p class="muted">İki sekmede bağlan, aynı odaya gir, hazır ol ve gerçek karşılaşmayı dene.</p>
<section class="card"><h2>1. Bağlan</h2><div class="row"><input id="name" class="grow" maxlength="20" placeholder="Oyuncu adı"><button id="connectBtn">Bağlan</button></div><p id="state" class="muted">Bağlı değil.</p></section>
<section class="card"><h2>2. Sabit Odalar</h2><div id="rooms" class="rooms"></div></section>
<section class="card"><h2>3. Özel Oda</h2><div class="row"><select id="size"><option value="2">2 kişilik</option><option value="3">3 kişilik</option><option value="4" selected>4 kişilik</option></select><button id="create">Özel oda oluştur</button></div><div class="row" style="margin-top:10px"><input id="code" inputmode="numeric" maxlength="6" placeholder="6 haneli kod"><button id="joinCode">Kodla katıl</button></div></section>
<section class="card"><h2>4. Oda</h2><div id="current" class="muted">Bir odada değilsin.</div><div class="row" style="margin-top:12px"><button id="ready" class="secondary">Hazırım</button><button id="startPrivate">Özel maçı başlat</button><button id="leave" class="danger">Odadan çık</button></div></section>
<section class="card"><h2>5. Karşılaşma</h2><div id="matchStatus" class="status">Karşılaşma bekleniyor.</div><div id="opponents"></div><div id="board" class="board"></div><div class="row"><input id="guess" maxlength="5" class="grow" placeholder="5 harfli tahmin"><button id="submitGuess">Tahmin Et</button><button id="surrender" class="danger">Pes Et</button></div><div id="result" class="status" hidden></div></section>
<section class="card"><h2>Olay Günlüğü</h2><pre id="log">Hazır.</pre></section>
</main><script src="/socket.io/socket.io.js"></script><script>
let socket=null,currentRoom=null,ready=false,myId=null,rows=[];
const $=id=>document.getElementById(id); const icons={correct:"🟩",present:"🟨",absent:"⬛"};
function log(v){const t=new Date().toLocaleTimeString("tr-TR");const s=typeof v==="string"?v:JSON.stringify(v,null,2);$("log").textContent=`[${t}] ${s}\n\n`+$("log").textContent}
function connected(ok,d=""){$("state").innerHTML=ok?`<span class="ok">● Bağlı</span> ${d}`:`<span class="bad">● Bağlı değil</span> ${d}`}
function renderRooms(list){$("rooms").innerHTML=list.map(r=>`<div class="room"><b>${r.name}</b><div class="muted">${r.playerCount}/${r.maxPlayers} • ${r.status}</div><button onclick="joinRoom('${r.id}')">Katıl</button></div>`).join("")}
function renderRoom(r){currentRoom=r;if(!r){$("current").textContent="Bir odada değilsin.";$("opponents").innerHTML="";return}$("current").innerHTML=`<b>${r.name}</b> — ${r.playerCount}/${r.maxPlayers}${r.code?` • Kod: <b>${r.code}</b>`:""}<div>${r.players.map(p=>`<div class="player"><span>${p.isHost?"👑 ":""}${p.name}${p.id===myId?" (sen)":""}</span><span>${p.connected?"🟢":"🟡"} ${p.ready?"Hazır":"Bekliyor"}</span></div>`).join("")}</div>`;renderOpponents(r);if(r.status==="countdown") $("matchStatus").textContent=`Geri sayım… ${r.countdownEndsAt||""}`;}
function renderOpponents(r){if(!r)return;$("opponents").innerHTML=r.players.filter(p=>p.id!==myId).map(p=>{const pats=p.match?.progress||[];return `<div class="player"><span>${p.name}</span><span class="patterns">${pats.map(row=>row.map(x=>icons[x]).join("")).join(" ")||"—"}</span></div>`}).join("")}
function renderBoard(){$("board").innerHTML=rows.map(r=>`<div class="guess-row">${[...r.word.toLocaleUpperCase('tr-TR')].map((ch,i)=>`<div class="tile ${r.result[i]}">${ch}</div>`).join("")}</div>`).join("")}
async function makeSession(name){const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});return r.json()}
async function connect(){const name=$("name").value.trim()||`Test ${Math.floor(Math.random()*900+100)}`;const s=await makeSession(name);socket=io({auth:{token:s.token},transports:['websocket','polling']});socket.on('connect',()=>{connected(true,`(${name})`);socket.emit('rooms:get',r=>r.ok&&renderRooms(r.rooms))});socket.on('connect_error',e=>connected(false,e.message));socket.on('session:ready',d=>{myId=d.playerId;if(d.room)renderRoom(d.room)});socket.on('rooms:update',renderRooms);socket.on('room:state',renderRoom);socket.on('match:countdown',d=>{$("matchStatus").textContent=`Geri sayım başladı: ${d.endsAt}`;$("result").hidden=true});socket.on('match:countdown-cancelled',d=>{$("matchStatus").textContent=d.message});socket.on('match:started',d=>{rows=[];renderBoard();$("result").hidden=true;$("matchStatus").textContent=`MAÇ BAŞLADI • Süre ${Math.round(d.durationMs/1000)} sn`;renderRoom(d.room)});socket.on('match:progress',d=>renderRoom(d.room));socket.on('match:finished',d=>{$("matchStatus").textContent='MAÇ BİTTİ';$("result").hidden=false;$("result").innerHTML=`Doğru kelime: <b>${d.answer.toLocaleUpperCase('tr-TR')}</b><br>${d.rankings.map(x=>`${x.place}. ${x.name} ${x.solved?'✅':''}`).join('<br>')}`;renderRoom(d.room)});socket.on('match:reset',d=>{$("matchStatus").textContent='Yeni karşılaşma için hazır ol.';ready=false;$("ready").textContent='Hazırım';renderRoom(d.room)});socket.on('disconnect',r=>connected(false,r))}
function req(){if(!socket?.connected){alert('Önce bağlan.');return false}return true}
window.joinRoom=id=>{if(!req())return;socket.emit('room:join',{roomId:id},r=>{if(!r.ok)alert(r.error.message);else renderRoom(r.room)})}
$("connectBtn").onclick=()=>connect().catch(e=>alert(e.message));$("create").onclick=()=>{if(!req())return;socket.emit('room:create-private',{maxPlayers:Number($("size").value)},r=>{if(!r.ok)alert(r.error.message);else{$("code").value=r.code;renderRoom(r.room)}})};$("joinCode").onclick=()=>{const c=$("code").value.replace(/\D/g,'').slice(0,6);if(c.length===6)joinRoom(c)};$("ready").onclick=()=>{if(!req())return;ready=!ready;socket.emit('player:ready',{ready},r=>{if(!r.ok){ready=!ready;alert(r.error.message)}$("ready").textContent=ready?'Hazır değilim':'Hazırım'})};$("startPrivate").onclick=()=>{if(!req())return;socket.emit('match:start-private',{},r=>{if(!r.ok)alert(r.error.message)})};$("leave").onclick=()=>socket?.emit('room:leave',r=>{if(r.ok){currentRoom=null;renderRoom(null)}});$("submitGuess").onclick=()=>{const word=$("guess").value.trim();socket?.emit('match:guess',{word},r=>{if(!r.ok)return alert(r.error.message);rows.push({word:r.guess,result:r.result});renderBoard();$("guess").value='';if(r.solved)$("matchStatus").textContent='Bildin! Diğer oyuncular bekleniyor…'})};$("guess").onkeydown=e=>{if(e.key==='Enter')$("submitGuess").click()};$("surrender").onclick=()=>socket?.emit('match:surrender',{},r=>{if(!r.ok)alert(r.error.message);else $("matchStatus").textContent=`Pes ettin. Doğru kelime: ${r.answer.toLocaleUpperCase('tr-TR')}`});fetch('/api/rooms').then(r=>r.json()).then(d=>d.ok&&renderRooms(d.rooms));
</script></body></html>
